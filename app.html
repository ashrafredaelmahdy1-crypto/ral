<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إميرا | لوحة التحكم</title>
  <meta name="description" content="نظام إدارة براند إميرا للملابس الطبية والمنتجات">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>

<!-- Toast Container -->
<div id="toast-container" class="toast-container"></div>

<!-- App Wrapper -->
<div class="app-wrapper">

  <!-- ========== SIDEBAR ========== -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <img src="1.png" alt="RAFAL" style="width:300px;height:auto;object-fit:contain;display:block;margin:0 auto;padding:var(--space-1) 0;">
    </div>

    <nav class="sidebar-nav">
      <span class="nav-section-label">الرئيسية</span>
      <div class="nav-item" data-page="dashboard">
        <span class="nav-icon">🏠</span>
        <span>لوحة التحكم</span>
      </div>

      <span class="nav-section-label">إدارة الطلبات</span>
      <div class="nav-item" data-page="new-order">
        <span class="nav-icon">➕</span>
        <span>إضافة طلب</span>
      </div>
      <div class="nav-item" data-page="orders">
        <span class="nav-icon">📋</span>
        <span>الطلبات</span>
      </div>
      <div class="nav-item" data-page="production">
        <span class="nav-icon">⚙️</span>
        <span>التنفيذ</span>
      </div>
      <div class="nav-item" data-page="shipping">
        <span class="nav-icon">🚚</span>
        <span>الشحن</span>
      </div>
      <div class="nav-item" data-page="history">
        <span class="nav-icon">🕐</span>
        <span>سجل الطلبات</span>
      </div>

      <span class="nav-section-label">إدارة البراند</span>
      <div class="nav-item" data-page="customers">
        <span class="nav-icon">👥</span>
        <span>العملاء</span>
      </div>
      <div class="nav-item" data-page="products">
        <span class="nav-icon">📦</span>
        <span>المنتجات</span>
      </div>
      <div class="nav-item" data-page="accounting">
        <span class="nav-icon">💰</span>
        <span>الحسابات</span>
      </div>
    </nav>

    <div class="sidebar-footer">
      <button class="logout-btn" id="logout-btn">
        <span>🚪</span>
        <span>تسجيل الخروج</span>
      </button>
    </div>
  </aside>

  <!-- Sidebar Overlay (mobile) -->
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <!-- ========== MAIN CONTENT ========== -->
  <main class="main-content">

    <!-- Topbar -->
    <header class="topbar">
      <button class="topbar-toggle" id="sidebar-toggle" aria-label="فتح القائمة">
        ☰
      </button>
      <div>
        <div class="topbar-title" id="topbar-title">لوحة التحكم</div>
        <div class="topbar-subtitle" id="topbar-subtitle">نظرة عامة على البراند</div>
      </div>
      <div class="topbar-right">
        <span class="topbar-date" id="topbar-date"></span>
      </div>
    </header>

    <!-- Page Content -->
    <div class="page-content" id="page-content">
      <!-- Pages are rendered here by the router -->
      <div class="empty-state" style="padding: 4rem">
        <div class="empty-state-icon">⏳</div>
        <h3>جارٍ التحميل...</h3>
      </div>
    </div>

    <footer class="app-footer">Developed by Eng. Ashraf El Mahdy</footer>

  </main>
</div>

<!-- ========== SCRIPTS ========== -->
<script src="js/auth.js"></script>
<script src="js/data.js"></script>
<script src="js/utils.js"></script>
<script src="js/router.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/customers.js"></script>
<script src="js/new-order.js"></script>
<script src="js/orders.js"></script>
<script src="js/production.js"></script>
<script src="js/accounting.js"></script>
<script src="js/shipping.js"></script>
<script src="js/history.js"></script>
<script src="js/products.js"></script>
<script src="js/app.js"></script>

</body>
</html>
